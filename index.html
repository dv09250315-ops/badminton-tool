<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>只給你看的小驚喜</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #fff1f5, #fdf7ff, #eef7ff);
      color: #3b2f35;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .heart-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      color: rgba(255, 120, 160, 0.35);
      animation: floatUp 8s linear infinite;
      font-size: 18px;
    }

    @keyframes floatUp {
      0% { transform: translateY(110vh) scale(0.8); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(-20vh) scale(1.4); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      width: 340px;
      min-height: 590px;
      max-width: 100%;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 42px;
      box-shadow: 0 20px 60px rgba(188, 117, 146, 0.22);
      padding: 48px 20px 24px;
      text-align: center;
      overflow: hidden;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #fff0f5;
      color: #c45b83;
      font-size: 13px;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 21px;
      line-height: 1.45;
      margin-bottom: 8px;
      color: #3a2a31;
    }

    .typewriter {
      min-height: 62px;
      font-size: 14px;
      line-height: 1.7;
      color: #5d4b53;
      margin: 10px 0 12px;
      white-space: pre-line;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 18px;
      background: #d96c94;
      margin-left: 3px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .status {
      background: #2d2730;
      color: #fff;
      border-radius: 18px;
      padding: 12px;
      text-align: left;
      font-family: Consolas, monospace;
      font-size: 11px;
      line-height: 1.55;
      margin: 12px 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }

    .status span {
      color: #ffb6cf;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 11px 14px;
      background: linear-gradient(135deg, #ff8fb3, #ffb2c9);
      color: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(255, 129, 173, 0.35);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    button:active {
      transform: scale(0.97);
      box-shadow: 0 6px 14px rgba(255, 129, 173, 0.3);
    }

    .secret {
      display: none;
      margin-top: 22px;
      padding: 18px;
      background: #fff6f9;
      border: 1px dashed #f2a7bf;
      border-radius: 20px;
      color: #6b4655;
      line-height: 1.55;
      font-size: 12px;
      animation: fadeIn .6s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #9b7b88;
    }
  </style>
</head>
<body>
  <div class="heart-bg" id="heartBg"></div>

  <main class="card">
    <div style="position:absolute;top:14px;left:50%;transform:translateX(-50%);width:140px;height:30px;background:#1f1f1f;border-radius:20px;z-index:5;"></div>
    <div class="badge">林宏翰戀愛檢測系統 v5.20</div>
    <h1>系統偵測到<br>你最近有點太可愛了</h1>

    <div class="typewriter">
      <span id="typing"></span><span class="cursor"></span>
    </div>

    <div class="status">
      > 正在掃描林宏翰... <span>100%</span><br>
      > 羽球成癮程度：<span>過高</span><br>
      > 被女友偷想次數：<span>∞</span><br>
      > 系統結論：<span>這男的不能放生</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px;">
      <button onclick="showSecret()">查看機密資料</button>
      <button onclick="loveCounter()">不要亂點</button>
      <button id="runBtn">不愛女友</button>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">
      <button onclick="choiceLove('A')">請女友吃飯</button>
      <button onclick="choiceLove('B')">帶女友打球</button>
    </div>

    <div id="counterText" style="margin-top:16px;color:#c05f84;font-size:14px;font-weight:600;"></div>

    <div class="secret" id="secret">
      <div style="font-size:16px;margin-bottom:8px;">⚠ 系統通知 ⚠</div>
      驗證成功。<br>
      你已成功綁定：<br>
      「張予柔限定女友系統」<br><br>
      已解鎖功能：<br>
      ✓ 自動分享廢片<br>
      ✓ 打球碎念模式<br>
      ✓ 隨機出現想你通知<br>
      ✓ 偶爾很黏人<br><br>
      注意：目前暫時無法解除綁定。
    </div>

    <div style="margin-top:12px;background:#fff8fb;border-radius:16px;padding:10px;border:1px solid #ffd5e4;line-height:1.55;color:#6d4a58;font-size:11px;">
      <b>男友狀態監測</b><br>
      名稱：林宏翰｜狀態：女友上頭中<br>
      系統建議：請投餵食物安撫。
    </div>

    <div class="footer">Made with love ♡</div>
  </main>

  <script>
    const text = "系統分析中...\\n最近有一位張姓女子\\n對你產生嚴重依賴。";
    const typing = document.getElementById("typing");
    let index = 0;

    function typeText() {
      if (index < text.length) {
        typing.textContent += text[index];
        index++;
        setTimeout(typeText, 75);
      }
    }
    typeText();

    function showSecret() {
      const secret = document.getElementById("secret");
      secret.style.display = "block";
    }

    let loveCount = 0;
    const messages = [
      "警告：女友想你次數過多",
      "系統錯誤：林宏翰過於欠抱",
      "已自動幫你加入女友黑名單（誤）",
      "今日親親額度 +1",
      "系統判定：這男的有點重要"
    ];

    function loveCounter() {
      const text = document.getElementById("counterText");
      text.innerHTML = messages[loveCount % messages.length];
      loveCount++;
    }

    function choiceLove(type) {
      const text = document.getElementById("counterText");
      text.innerHTML = type === 'A'
        ? "選擇成功：今天已被女友愛爆 ♡"
        : "系統紀錄：明天也逃不掉 ♡";
    }

    const runBtn = document.getElementById("runBtn");

    runBtn.addEventListener("mouseover", () => {
      const x = Math.random() * 220 - 110;
      const y = Math.random() * 80 - 40;
      runBtn.style.transform = `translate(${x}px, ${y}px)`;
      runBtn.innerText = "你沒有這個選項";
    });

    const heartBg = document.getElementById("heartBg");
    for (let i = 0; i < 22; i++) {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "♡";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDelay = Math.random() * 8 + "s";
      heart.style.animationDuration = 6 + Math.random() * 6 + "s";
      heart.style.fontSize = 14 + Math.random() * 18 + "px";
      heartBg.appendChild(heart);
    }
  </script>
</body>
</html>
