<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>幸運大轉盤</title>
<style>
:root{--bg:#fff7ed;--fg:#1f2937;--card:#fff;--btn:#ea580c;--btnfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--fg:#f5f5f4;--card:#292524;--btn:#f97316;--btnfg:#1c1917}}
:root[data-theme="dark"]{--bg:#1c1917;--fg:#f5f5f4;--card:#292524;--btn:#f97316;--btnfg:#1c1917}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 16px;min-height:100vh}
h1{margin:0 0 16px;font-size:26px}
.wrap{position:relative;width:min(88vw,420px);aspect-ratio:1}
canvas{width:100%;height:100%;border-radius:50%;transition:transform 5s cubic-bezier(.12,.6,.1,1);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid #dc2626;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.hub{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:1}
button{margin-top:24px;padding:14px 48px;font-size:20px;font-weight:700;border:0;border-radius:999px;background:var(--btn);color:var(--btnfg);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#result{margin-top:20px;min-height:36px;font-size:24px;font-weight:700;text-align:center}
</style>
</head>
<body>
<h1>🎯 幸運大轉盤</h1>
<div class="wrap">
  <div class="pointer"></div>
  <canvas id="wheel" width="840" height="840"></canvas>
  <div class="hub"></div>
</div>
<button id="spin">開始抽獎</button>
<div id="result"></div>
<script>
const prizes=[
  {name:"折50塊",color:"#ef4444"},
  {name:"水壺",color:"#3b82f6"},
  {name:"握把布",color:"#22c55e"},
  {name:"免費打一次",color:"#f59e0b"}
];
const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d");
const S=canvas.width,C=S/2,R=C-6;
let acc=0;
// 機率（已編碼）：35 / 25 / 25 / 15，順序對應上面四個獎項
const W=JSON.parse(atob("WzM1LDI1LDI1LDE1XQ=="));
prizes.forEach((z,i)=>{z.p=W[i];z.start=i*90;z.end=(i+1)*90;});
prizes.forEach(z=>{
  const a0=(z.start-90)*Math.PI/180,a1=(z.end-90)*Math.PI/180;
  ctx.beginPath();ctx.moveTo(C,C);ctx.arc(C,C,R,a0,a1);ctx.closePath();
  ctx.fillStyle=z.color;ctx.fill();
